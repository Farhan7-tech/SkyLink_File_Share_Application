name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "SkyLinkSB/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "SkyLinkSB/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SkyLinkSB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run tests
        run: mvn -B verify
